name: House Prices CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install locked dependencies
        run: uv sync --frozen --dev --no-install-project --python 3.13

      - name: Lint
        run: uv run --no-sync ruff check api src tests

      - name: Test request schema validation
        run: uv run --no-sync python -m pytest tests/test_request_schema.py -q