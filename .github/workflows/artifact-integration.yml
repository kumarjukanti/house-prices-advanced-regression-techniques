name: House Prices Artifact Integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact-tests:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: artifact-integration

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Install locked dependencies
        run: uv sync --frozen --dev --no-install-project --python 3.13

      - name: Check GitHub OIDC identity
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in url else "?"
          url += separator + urllib.parse.urlencode(
              {"audience": "sts.amazonaws.com"}
          )

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": (
                      "Bearer "
                      + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
                  )
              },
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          # Print selected claims only, never the token.
          for key in ["sub", "aud", "repository", "environment"]:
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DVC_READ_ROLE_ARN }}
          aws-region: us-west-1

      - name: Download DVC artifacts
        run: uv run --no-sync dvc pull

      - name: Generate model lineage
        run: uv run --no-sync python src/models/create_lineage.py

      - name: Run all tests
        run: uv run --no-sync python -m pytest -q