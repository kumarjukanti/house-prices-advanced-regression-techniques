version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.106",
    "dvc[s3]>=3.67.1",
    "fastapi>=0.143.2",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "mlflow>=1.27.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
